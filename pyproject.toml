[project]
name = "bauhelfer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django>=5.0,<6",
    "django-environ>=0.14.0",
    "psycopg[binary]>=3.3.6",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.local"

[tool.ruff]
extend-exclude = ["*/migrations"]  # generated by Django, not edited by hand
