[project]
name = "bauhelfer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django>=5.0,<6",
    "django-environ>=0.14.0",
    "gunicorn>=26.2.0",
    "psycopg[binary]>=3.3.6",
    "pytailwindcss>=0.3.1",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "allure-pytest>=2.16.2",
    "interrogate>=1.7.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "pytest-playwright>=0.10.0",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.local"
addopts = "--strict-markers"  # a typo like pytest.mark.stroy(9) is an error, not a warning
markers = [
    "story(number): the GitHub issue (story) the test belongs to; groups the Allure report",
]

[tool.ruff]
extend-exclude = ["*/migrations"]  # generated by Django, not edited by hand

[tool.coverage.run]
source = ["."]
branch = true  # an `if` counts as covered only when tests take both ways (#14)
omit = [
    ".venv/*",
    "*/migrations/*",
    "*/tests/*",
    "tests/*",
    "manage.py",
    "config/asgi.py",  # server entry points, started by gunicorn, not by tests
    "config/wsgi.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.interrogate]
fail-under = 80
exclude = [".venv", "*/migrations", "*/tests", "tests"]
ignore-init-module = true  # empty __init__.py files
ignore-magic = true  # __str__ and friends: the name says what they do
ignore-nested-classes = true  # class Meta, TextChoices inside a model
verbose = 1
