{% extends "base.html" %}
{% load i18n %}

{% block title %}{% translate "Password changed" %} · BauHelfer{% endblock %}

{% block content %}
  <div class="card mx-auto max-w-md bg-base-100 shadow-sm">
    <div class="card-body">
      <h1 class="card-title text-2xl">{% translate "Password changed" %}</h1>
      <p>{% translate "Your new password is saved. You can log in now." %}</p>
      <a href="{% url 'login' %}" class="btn btn-primary">{% translate "Log in" %}</a>
    </div>
  </div>
{% endblock %}
