# Runs linting and tests on every pull request and on every push to main (a merged PR is
# a push to main). Pushing a feature branch without a PR runs nothing.
# The push-to-main run stays on purpose: it checks the merged result, and Render deploys
# only after the checks on that main commit are green (autoDeployTrigger: checksPass).
# If any step fails, the check turns red and the PR cannot be merged.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# The built-in token may only read the code and the issues (issue titles for the report).
permissions:
  contents: read
  issues: read

jobs:
  test:
    runs-on: ubuntu-latest

    # A throwaway PostgreSQL for this run, same version as docker-compose.yml.
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_DB: bauhelfer
          POSTGRES_USER: bauhelfer
          POSTGRES_PASSWORD: bauhelfer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bauhelfer -d bauhelfer"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    # Settings normally read from .env, which is not in the repo.
    # These values exist only inside this CI run.
    env:
      SECRET_KEY: ci-only-not-secret
      DATABASE_URL: postgres://bauhelfer:bauhelfer@localhost:5432/bauhelfer
      TAILWINDCSS_VERSION: v4.3.3  # same as render.yaml

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked  # fails if uv.lock is out of date with pyproject.toml

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Build CSS  # app.css is not in git; the layout tests need it
        run: uv run tailwindcss -i tailwind/input.css -o static/css/app.css --minify

      - name: Install Chromium for the E2E tests  # tests/e2e/, Playwright (#14)
        # --with-deps: system libraries. --only-shell: only the headless browser; CI has no
        # window, so the full Chrome would be downloaded for nothing.
        run: uv run playwright install --with-deps --only-shell chromium

      - name: Save issue titles for the Allure report  # tests are grouped by story (#89)
        # Written to a temporary file first, so a failed call leaves no broken stories.json.
        # Without the file the report shows "#9" instead of "#9 <title>"; tests still run.
        run: >-
          gh issue list --repo "$GITHUB_REPOSITORY" --state all --limit 300
          --json number,title,milestone > stories.tmp && mv stories.tmp stories.json
        env:
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true

      - name: Tests with coverage (fails below 80%)
        run: uv run pytest --cov --alluredir=allure-results

      - name: Docstring coverage (fails below 80%)
        run: uv run interrogate .

      # The report is built also when tests fail: that is when it is needed most.
      - uses: actions/setup-node@v7
        if: ${{ !cancelled() }}
        with:
          node-version: 22

      - name: Build the Allure report  # settings in allurerc.json
        if: ${{ !cancelled() }}
        run: npx --yes allure@3.20.0 generate allure-results

      - name: Show the test result on the run's Summary page
        if: ${{ !cancelled() }}
        run: >-
          jq -r '.stats | "**Allure report:** \(.total) tests, \(.passed // 0) passed,
          \(.failed // 0) failed, \(.broken // 0) broken. Download the `allure-report`
          artifact below; the report of `main` is at https://andrewkchn.github.io/BauHelfer/"'
          allure-report/summary.json >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the report with this run  # download it from the run's Summary page
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: allure-report

      - name: Prepare the report for GitHub Pages
        if: ${{ !cancelled() && github.event_name == 'push' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: allure-report

  # Publishes the report of main to GitHub Pages. Never fails: Render deploys only when
  # all checks are green (autoDeployTrigger: checksPass), and a broken report upload must
  # not stop the site from deploying.
  publish-report:
    if: ${{ !cancelled() && github.event_name == 'push' }}
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
        continue-on-error: true
